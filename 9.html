<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Rencana Kerja</title>
</head>

<body>
    <h2>Daftar Rencana Kerja</h2>
    <input type="text" id="task" placeholder="Masukkan tugas baru...">
    <button id="tambah">Tambah</button>
    <ul id="tasks">

    </ul>
    <script>

        const taskName = document.getElementById('task');
        const listTasks = document.getElementById('tasks');

        function createTask() {
            const task = taskName.value;
            if (task === "") {
                alert('Task tidak boleh kosong');
                taskName.focus();
                return;
            }
            //createElement
            const li = document.createElement('li');

            li.innerText = task;

            li.innerHTML = ` 
      <span>${task}</span>
      <button class="btn-remove">Hapus</button>
      `
            listTasks.appendChild(li);
            taskName.value = "";

            //const btnRemove = document.createElement('button');
            //btnRemove.innerText = "Hapus";
            //li.appendChild(btnRemove);

            /*
            btnRemove.addEventListener('click', () => {
              li.remove();
            })
            */

        }

        document.getElementById('tambah').addEventListener('click', function () {
            createTask();
        });

        taskName.addEventListener('keyup', function (event) {
            if (event.key === "Enter") {
                createTask();
            }
        })

        listTasks.addEventListener('click',(e) => {

            if(e.target.classList.contains('btn-remove')) {
            const li = e.target.parentElement;
            li.remove();
        }
    })

    </script>
</body>

</html>
